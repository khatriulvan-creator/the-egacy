
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Fashion Prompt Builder | THE PRINTED LEGACY</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#0b0b0b;color:#f5f1e8;
 font-family:Arial,sans-serif
}
.container{max-width:700px;margin:auto}
.brand{
 color:#d6b56d;letter-spacing:3px;
 font-size:13px;font-weight:bold
}
h1{font-size:27px;margin-top:25px}
.subtitle{color:#aaa;line-height:1.6}
.card{
 background:#151515;border:1px solid #30291e;
 border-radius:14px;padding:20px;margin-top:20px
}
label{
 display:block;margin:17px 0 8px;
 font-size:14px;font-weight:bold;color:#d6b56d
}
input,select,textarea{
 width:100%;padding:13px;
 background:#101010;color:white;
 border:1px solid #393939;border-radius:8px;
 font-size:15px
}
textarea{min-height:90px;resize:vertical}
button{
 width:100%;padding:14px;margin-top:12px;
 border:0;border-radius:9px;
 background:#d6b56d;color:#111;
 font-weight:bold;font-size:15px
}
button.secondary{
 background:#262626;color:#eee;
 border:1px solid #444
}
.output{
 min-height:180px;white-space:pre-wrap;
 line-height:1.7;font-size:14px;color:#eee
}
.footer{
 text-align:center;color:#777;
 font-size:12px;margin:30px 0
}
</style>
</head>

<body>
<div class="container">

<div class="brand">THE PRINTED LEGACY</div>

<h1>AI Fashion Prompt Builder</h1>

<p class="subtitle">
Create professional fashion photography prompts
for your clothing and textile products.
</p>

<div class="card">

<label>Model</label>
<select id="model">
<option>Adult Indian male model</option>
<option>Adult Indian female model</option>
<option>Adult Indian couple</option>
<option>No model, product photography only</option>
</select>

<label>Product Type</label>
<select id="product">
<option>Ajrakh kurta</option>
<option>Ajrakh 3-piece suit</option>
<option>Ajrakh saree</option>
<option>Ajrakh dupatta</option>
<option>Bandhani suit</option>
<option>Bandhani saree</option>
<option>Ethnic shirt</option>
<option>Custom clothing</option>
</select>

<label>Fabric / Material</label>
<input id="fabric" placeholder="e.g. Cotton, Modal Silk">

<label>Colour</label>
<input id="colour" placeholder="e.g. Light purple, maroon">

<label>Print / Design</label>
<textarea id="design" placeholder="Describe the exact print, motifs, pattern and details..."></textarea>

<label>Background</label>
<select id="background">
<option>Luxury sandstone palace</option>
<option>Minimal beige studio</option>
<option>Royal heritage architecture</option>
<option>Outdoor garden</option>
<option>Traditional Indian courtyard</option>
<option>Dark luxury studio</option>
<option>Custom background</option>
</select>

<label>Pose</label>
<select id="pose">
<option>Natural standing pose</option>
<option>Walking candid pose</option>
<option>Royal confident pose</option>
<option>Side profile pose</option>
<option>Seated traditional pose</option>
<option>Fabric detail showcase</option>
</select>

<label>Photography Style</label>
<select id="style">
<option>Luxury editorial photography</option>
<option>Realistic DSLR photography</option>
<option>Cinematic golden hour</option>
<option>Minimal luxury campaign</option>
<option>Traditional heritage fashion</option>
</select>

<label>Aspect Ratio</label>
<select id="ratio">
<option>4:5 Instagram portrait</option>
<option>9:16 vertical Reel</option>
<option>1:1 square</option>
<option>16:9 landscape</option>
</select>

<label>Extra Instructions</label>
<textarea id="extra" placeholder="Jewellery, lighting, camera, styling, etc."></textarea>

<button onclick="generate()">Generate Prompt ✨</button>
<button class="secondary" onclick="clearForm()">Clear Form</button>

</div>

<div class="card">
<label>Generated AI Prompt</label>
<div class="output" id="output">
Your generated prompt will appear here.
</div>
<button onclick="copyPrompt()">Copy Prompt 📋</button>
</div>

<div class="footer">
THE PRINTED LEGACY • Crafted with creativity
</div>

</div>

<script>
function generate(){

const model=document.getElementById("model").value;
const product=document.getElementById("product").value;
const fabric=document.getElementById("fabric").value;
const colour=document.getElementById("colour").value;
const design=document.getElementById("design").value;
const background=document.getElementById("background").value;
const pose=document.getElementById("pose").value;
const style=document.getElementById("style").value;
const ratio=document.getElementById("ratio").value;
const extra=document.getElementById("extra").value;

const prompt=`Create a premium fashion campaign photograph for THE PRINTED LEGACY.

MODEL: ${model}

PRODUCT: ${product}

FABRIC: ${fabric || "As shown in the reference image"}

COLOUR: ${colour || "Preserve the original product colour"}

DESIGN: ${design || "Preserve the exact original garment design"}

BACKGROUND: ${background}

POSE: ${pose}

PHOTOGRAPHY: ${style}, realistic photography, professional camera, natural fabric texture, detailed stitching, elegant composition, premium fashion brand campaign.

PRODUCT ACCURACY:
Preserve the original clothing design, print, pattern, colour, fabric texture, borders and garment details exactly as shown in the reference image. Do not redesign, recolour, replace, simplify or add extra patterns. The clothing must remain the main focus.

LIGHTING: Soft professional lighting, natural shadows, balanced exposure and realistic skin tones.

COMPOSITION: Clean luxury styling, realistic proportions, sharp garment details, professional fashion photography.

FORMAT: ${ratio}

ADDITIONAL INSTRUCTIONS:
${extra || "No additional instructions"}

Avoid distorted hands, extra fingers, artificial fabric textures, incorrect prints, unwanted accessories, text, logos, watermarks or excessive editing.`;

document.getElementById("output").textContent=prompt;
}

function copyPrompt(){
const text=document.getElementById("output").textContent;
if(text==="Your generated prompt will appear here."){
alert("First generate a prompt!");
return;
}
navigator.clipboard.writeText(text)
.then(()=>alert("Prompt copied!"))
.catch(()=>alert("Select and copy the prompt manually."));
}

function clearForm(){
document.querySelectorAll("input,textarea").forEach(e=>e.value="");
document.querySelectorAll("select").forEach(e=>e.selectedIndex=0);
document.getElementById("output").textContent="Your generated prompt will appear here.";
}
</script>

</body>
</html>
